name: Grails
options:
  bundleIdPrefix: xyz.arjoon
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  GrailsKit:
    path: Packages/GrailsKit
targets:
  Grails:
    type: application
    platform: macOS
    sources:
      - path: Apps/Grails
        excludes:
          - Resources/Paintings/**
      - path: Extensions/chrome
        type: folder
        buildPhase: resources
      - path: Apps/Grails/Resources/Paintings
        type: folder
        buildPhase: resources
    dependencies:
      - package: GrailsKit
      - package: GrailsKit
        product: GrailsDesign
    info:
      path: Config/Grails-Info.plist
      properties:
        CFBundleDisplayName: Grails
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.graphics-design
        NSHumanReadableCopyright: MIT licensed
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Grails Library
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes: [xyz.arjoon.grails.library]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: xyz.arjoon.grails.library
            UTTypeDescription: Grails Library
            UTTypeConformsTo: [com.apple.package]
            UTTypeTagSpecification:
              public.filename-extension: [grails, stash]
          - UTTypeIdentifier: xyz.arjoon.grails.items
            UTTypeDescription: Grails Items
            UTTypeConformsTo: [public.data]
          - UTTypeIdentifier: xyz.arjoon.grails.collection
            UTTypeDescription: Grails Collection
            UTTypeConformsTo: [public.data]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.arjoon.grails
        PRODUCT_NAME: Grails
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
  GrailsCLI:
    type: tool
    platform: macOS
    sources: [Apps/GrailsCLI]
    dependencies:
      - package: GrailsKit
    settings:
      base:
        PRODUCT_NAME: grails
        CODE_SIGN_IDENTITY: "-"
  GrailsUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Apps/GrailsUITests]
    dependencies:
      - target: Grails
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
schemes:
  Grails:
    build:
      targets:
        Grails: all
        GrailsCLI: all
    test:
      targets: [GrailsUITests]
