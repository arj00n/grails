name: CI
# Manual only (Actions tab ▸ CI ▸ Run workflow). The app needs macOS 27 / Xcode 27, which GitHub's macOS runners may not
# have yet, and macOS minutes are expensive on private repos. Re-enable `push` and `pull_request` once a runner image has it.
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Test GrailsKit
        run: cd Packages/GrailsKit && swift test
      - name: Build app
        run: |
          xcodegen
          xcodebuild -scheme Grails -destination 'platform=macOS' build CODE_SIGNING_ALLOWED=NO
