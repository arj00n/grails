name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Test StashKit
        run: cd Packages/StashKit && swift test
      - name: Build app
        run: |
          xcodegen
          xcodebuild -scheme Stash -destination 'platform=macOS' build CODE_SIGNING_ALLOWED=NO
