<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Open in Grails</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; color: rgba(255,255,255,.92); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { min-height: 100%; display: grid; place-items: center; padding: 24px; }
  .card { width: min(420px, 100%); padding: 28px; border-radius: 22px; background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
  h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
  p { margin: 0 0 22px; color: rgba(255,255,255,.55); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  a.btn { display: inline-block; padding: 10px 18px; border-radius: 999px; text-decoration: none; font-weight: 500; }
  a.primary { background: #fff; color: #000; }
  a.ghost { background: rgba(255,255,255,.12); color: #fff; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1 id="title">Open in Grails</h1>
    <p id="sub"></p>
    <div class="row">
      <a class="btn primary" id="open" href="#">Open in Grails</a>
      <a class="btn ghost" id="get" href="#">Get Grails</a>
    </div>
  </div>
</main>
<script>
  // Set this to wherever the app's releases live.
  var DOWNLOAD_URL = "https://github.com/arj00n/stash/releases";

  // The link's details sit after the # so they never reach the server that hosts this page.
  var params = new URLSearchParams(location.hash.replace(/^#/, ""));
  var app = "grails://open?" + params.toString();
  var name = params.get("name");
  document.getElementById("sub").textContent = name ? "“" + name + "”" : "";
  document.getElementById("open").href = app;
  document.getElementById("get").href = DOWNLOAD_URL;
  if (params.get("lib")) setTimeout(function () { location.href = app; }, 150);
  else { document.getElementById("title").textContent = "This link is incomplete"; document.getElementById("open").hidden = true; }
</script>
</body>
</html>
